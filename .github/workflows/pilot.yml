name: Proposal Intake · Decision Record · Reminder
on:
  issues:
    types: [opened, edited, labeled, unlabeled, assigned, unassigned, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '0 0 * * 1-5' # 09:00 Asia/Seoul; configured holidays are checked in code
  workflow_dispatch:
permissions:
  contents: read
  issues: write
# The entire small pilot is reconciled each time. Replaced pending runs do not
# drop an individual issue, and state writes / separate delivery jobs serialize.
concurrency:
  group: proposal-pilot
  cancel-in-progress: false
jobs:
  records:
    if: github.event.issue.pull_request == null && (github.event_name != 'schedule' || vars.PILOT_ACTIVE == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pilot.runner reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_ACTIVE: ${{ vars.PILOT_ACTIVE }}
  discord:
    needs: records
    if: vars.PILOT_ACTIVE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pilot.runner notify
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_ACTIVE: ${{ vars.PILOT_ACTIVE }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_PROPOSAL_PILOT_WEBHOOK }}
