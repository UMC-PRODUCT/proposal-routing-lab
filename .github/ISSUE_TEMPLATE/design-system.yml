    value: '이 저장소의 제목·본문·댓글·첨부는 공개됩니다. 실제 사용자 개인정보나 민감한 원본 자료는 기존 비공개 작업에 보관해주세요.

      등록된 구성원의 제품·기능 개선과 Design System 제안만 접수합니다. 조직의 인사·회의·운영 제도 변경과 일상 개발 작업은 기존 경로를 사용해주세요.

      [접수 상태와 사용 안내](https://github.com/UMC-PRODUCT/proposal-routing-lab/blob/main/START-HERE.md)를 먼저 확인해주세요.


      담당자 등록 준비 중: Design Platform. 이 영역은 현재 정상 자동 접수를 시작하지 않았습니다. 제출하더라도 임의의 PM에게 배정하지 않습니다.'
