name: Design System Proposal
description: 여러 팀이나 플랫폼이 함께 사용하는 디자인 요소와 규칙의 변경을 제안합니다.
title: '[Design System] '
labels: [proposal, 'proposal:design-system']
body:
  - type: markdown
    attributes:
      value: |
        실제 접수는 파일럿 운영 담당자가 역할과 설정을 수락하고 활성화한 뒤 시작합니다.
        먼저 [접수 상태와 준비 기록](https://github.com/UMC-PRODUCT/proposal-routing-lab/issues/1)과
        [제출 전 안내](https://github.com/UMC-PRODUCT/proposal-routing-lab/blob/main/START-HERE.md)를 확인해주세요.

        파일럿 참가자의 공통 컴포넌트·디자인 토큰·패턴 변경, 여러 플랫폼이 지키는 공통 규칙 변경,
        기존 제품에 적용하는 방법과 공통 원칙의 예외를 제안받습니다.
        일상적인 목적팀 화면 변경은 기존 팀의 작업 경로에 등록해주세요.
        접수 후 운영 담당자가 제안을 읽고 결정권자에게 연결합니다.
        아래 예시는 작성에 참고하고, 확인한 사실과 제안 내용을 적어주세요.
        본문은 12,000자 이내로 적고 제목·본문에 개인정보나 비밀값을 넣지 마세요.
  - type: dropdown
    id: platform
    attributes:
      label: 플랫폼 범위
      description: 변경에 영향을 받는 항목을 모두 선택해주세요. 여러 플랫폼이 함께 지키는 행동·상태 규칙을 바꾸면 Shared Contract도 선택해주세요.
      options: [iOS, Android, Web, Shared Contract]
      multiple: true
    validations: {required: true}
  - type: textarea
    id: problem
    attributes:
      label: 관련 Purpose·사용자 문제
      description: 관련된 목적팀과, 그 팀의 사용자가 어떤 상황에서 겪는 문제인지 적어주세요.
      placeholder: '예: 모집 기능을 이용하는 사용자가 신청 처리 중에 버튼을 다시 눌러도 되는지 알기 어렵습니다. iOS와 Web에서 처리 중 표시가 다릅니다.'
    validations: {required: true}
  - type: textarea
    id: figma
    attributes:
      label: Figma Node Link 또는 미존재 사유
      description: '변경할 대상이 있으면 해당 프레임이나 컴포넌트를 가리키는 node-id가 포함된 Figma HTTPS 링크 하나를 적어주세요. 아직 대상이 없으면 "미존재: 구체적 사유" 형식으로 적어주세요.'
      placeholder: '미존재: 새 공통 원칙을 제안하는 단계라 아직 해당 상태를 표현한 Figma 컴포넌트가 없습니다.'
    validations: {required: true}
  - type: textarea
    id: common
    attributes:
      label: 공통 행동·상태
      description: 화면 표현이 달라도 모든 플랫폼에서 같아야 하는 사용자 행동과 상태를 적어주세요.
      placeholder: '예: 신청 처리 중에는 같은 요청을 다시 보내지 않도록 하고, 사용자가 처리 중이라는 상태를 알 수 있어야 합니다.'
    validations: {required: true}
  - type: textarea
    id: adaptation
    attributes:
      label: 플랫폼별 표현·이유
      description: 플랫폼에 따라 달라야 하는 표시나 조작 방법과 그 이유를 적어주세요. 차이가 필요하지 않다면 그 이유를 적어주세요.
      placeholder: '예: 처리 중 표시는 각 플랫폼에서 쓰는 진행 표시기를 사용하고 싶습니다. 사용자가 익숙한 표시를 통해 상태를 이해하도록 하기 위해서입니다.'
    validations: {required: true}
  - type: textarea
    id: impact
    attributes:
      label: Component·Token·Migration 영향
      description: 어떤 공통 컴포넌트나 디자인 토큰이 바뀌며, 이를 사용하는 기존 화면에서 무엇을 수정해야 하는지 적어주세요. 아직 확인하지 못한 영향은 따로 표시해주세요.
      placeholder: '예: 공통 버튼 컴포넌트에 처리 중 상태를 추가합니다. 기존 신청 화면에서 이 상태를 연결해야 합니다. 다른 화면의 영향은 아직 확인하지 못했습니다.'
    validations: {required: true}
  - type: textarea
    id: conditions
    attributes:
      label: 성공·중단 조건
      description: 변경 결과 중 무엇을 보고 적용을 이어가거나 멈출지 적어주세요. 공통 규칙과 기존 화면에 생기는 영향을 확인할 수 있는 조건을 써주세요.
      placeholder: '예: 대상 플랫폼에서 처리 중임을 알 수 있고 기존 버튼 동작도 유지되면 적용을 검토합니다. 기존 화면의 필수 동작을 막으면 적용을 멈추고 규칙을 다시 검토합니다.'
    validations: {required: true}
  - type: dropdown
    id: owner
    attributes:
      label: DRI 의향
      description: 제안이 진행되면 실행을 맡을 의향이 있는지 선택해주세요. 여기서 선택해도 담당자로 확정되지는 않으며, 실제로 맡을 때는 해당 결정에 별도로 수락 댓글을 남깁니다.
      options: ['맡을 의향 있음', '협의 필요', '제안만 하고 싶음']
    validations: {required: true}
