name: 제품·기능 개선 제안
description: 사용자가 겪는 문제와 필요한 도움을 남겨주세요.
title: '[제품 제안] '
labels:
- intake
- intake:product
body:
- type: markdown
  attributes:
    value: '이 저장소의 제목·본문·댓글·첨부는 공개됩니다. 실제 사용자 개인정보나 민감한 원본 자료는 기존 비공개 작업에 보관해주세요.

      등록된 구성원의 제품·기능 개선과 Design System 제안만 접수합니다. 조직의 인사·회의·운영 제도 변경과 일상 개발 작업은 기존 경로를 사용해주세요.

      [접수 상태와 사용 안내](https://github.com/UMC-PRODUCT/proposal-routing-lab/blob/main/START-HERE.md)를 먼저 확인해주세요.


      담당자 등록 준비 중: Brand & Growth, Learning & Activity, Community & Connection, Operations Enablement. 이 영역은 현재 정상 자동 접수를 시작하지 않았습니다. 제출하더라도 임의의 PM에게 배정하지 않습니다.


      대상이 불명확하면 ''모르겠음 / 여러 영역에 해당''을 선택하세요. 연결 담당자가 책임 범위를 확인합니다.'
- type: dropdown
  id: target
  attributes:
    label: 대상
    options:
    - 공식 홈페이지·테크 블로그·대외 콘텐츠
    - 리크루팅 전체 Journey
    - UPMS·프로젝트 매칭·프로젝트 활동
    - 커리큘럼·워크북·미션·피드백·출석·일정·수료
    - 커뮤니티·Connect·전자명함·관계 경험
    - 기수·조직·구성원·역할·상벌점·운영 승인
    - 공지 작성·대상 결정
    - 운영 Analytics·감사 조회
    - 모르겠음 / 여러 영역에 해당
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: 문제
    description: 누가 어떤 상황에서 무엇을 어려워하나요?
    placeholder: 관찰한 문제와 아직 확인하지 못한 내용을 구분해주세요.
  validations:
    required: true
- type: textarea
  id: help
  attributes:
    label: 원하는 도움
    description: 함께 확인하거나 결정해주었으면 하는 내용. 완성된 해결책이 없어도 됩니다.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: 근거·스크린샷·Figma 링크
    description: 선택 사항입니다. 공개 가능한 자료만 첨부하고 민감한 원본은 비공개 작업에서 관리해주세요.
  validations:
    required: false
