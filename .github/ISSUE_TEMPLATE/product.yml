name: 제품·기능 Proposal
description: 사용자가 겪는 문제와 확인할 방법을 제안합니다.
title: '[Product] '
labels: [proposal, 'proposal:product']
body:
  - type: markdown
    attributes:
      value: |
        실제 접수는 파일럿 운영 담당자가 역할과 설정을 수락하고 활성화한 뒤 시작합니다.
        먼저 [접수 상태와 준비 기록](https://github.com/UMC-PRODUCT/proposal-routing-lab/issues/1)과
        [제출 전 안내](https://github.com/UMC-PRODUCT/proposal-routing-lab/blob/main/START-HERE.md)를 확인해주세요.

        파일럿 참가자의 제품·기능 제안을 받습니다. 팀 내부의 일상 작업은 기존 경로에 등록해주세요.
        접수 후 운영 담당자가 제안을 읽고 결정권자에게 연결합니다.
        아래 예시는 작성에 참고하고, 확인한 사실과 제안 내용을 적어주세요.
        본문은 12,000자 이내로 적고 제목·본문에 개인정보나 비밀값을 넣지 마세요.
  - type: dropdown
    id: purpose
    attributes:
      label: Purpose Team
      description: 관련 있다고 생각하는 목적팀을 선택해주세요. 판단하기 어렵다면 '모르겠음'을 선택해도 됩니다. 최종 연결은 운영 담당자가 확인합니다.
      options: ['Brand & Growth', 'Learning & Activity', 'Community & Connection', 'Operations Enablement', '모르겠음']
    validations: {required: true}
  - type: textarea
    id: problem
    attributes:
      label: 사용자 문제
      description: 누가 어떤 상황에서 무엇을 하려다 어려움을 겪었는지 적어주세요.
      placeholder: '예: 모바일에서 모집 안내를 읽은 지원자가 신청 버튼을 찾지 못해 문의합니다.'
    validations: {required: true}
  - type: textarea
    id: mission
    attributes:
      label: Mission 연결
      description: 이 문제를 해결하면 팀의 목적에 어떤 도움이 되는지 적어주세요. 판단하기 어렵다면 관련성을 확인해야 하는 이유를 적어주세요.
      placeholder: '예: 지원자가 신청 경로를 찾는 데 드는 어려움을 줄여, 팀의 모집 활동을 돕고 싶습니다.'
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes:
      label: 근거
      description: 직접 확인한 사실과 아직 확인하지 못한 추측을 나눠 적어주세요. 관련 기록이 있으면 링크를 함께 남겨주세요.
      placeholder: |
        예:
        확인한 사실: 신청 위치를 묻는 문의가 있었습니다.
        추측: 모바일 화면에서 버튼이 눈에 잘 띄지 않을 수 있습니다.
        확인할 내용: 버튼 위치가 실제 원인인지 확인해야 합니다.
    validations: {required: true}
  - type: textarea
    id: experiment
    attributes:
      label: 가장 작은 검증
      description: 제안을 진행할지 판단하기 위해 먼저 확인할 내용과 방법을 적어주세요. 전체 기능을 만들기 전에 확인할 수 있는 방법부터 생각해주세요.
      placeholder: '예: 버튼 문구와 위치를 바꾼 시안을 보여주고, 지원자가 도움 없이 신청 경로를 찾는지 확인합니다.'
    validations: {required: true}
  - type: textarea
    id: conditions
    attributes:
      label: 성공·중단 조건
      description: 검증 결과 중 무엇을 보고 제안을 이어가거나 멈출지 적어주세요. 실제로 관찰하거나 측정할 수 있는 조건을 써주세요.
      placeholder: '예: 지원자가 도움 없이 신청 경로를 찾으면 실제 화면 반영을 검토합니다. 같은 위치에서 계속 막히면 이 시안의 적용을 멈추고 원인을 다시 확인합니다.'
    validations: {required: true}
  - type: textarea
    id: collaboration
    attributes:
      label: 필요한 협업
      description: 누구에게 어떤 도움이 필요한지 적어주세요. 협업이 필요하지 않다면 그 이유를 적어주세요. 이 항목에 적는 것만으로 상대방의 업무가 확정되지는 않습니다.
      placeholder: '예: 디자이너에게 버튼 문구와 위치를 바꾼 시안 검토를 요청하고 싶습니다. 아직 협의하지 않았습니다.'
    validations: {required: true}
  - type: dropdown
    id: owner
    attributes:
      label: DRI 의향
      description: 제안이 진행되면 실행을 맡을 의향이 있는지 선택해주세요. 여기서 선택해도 담당자로 확정되지는 않으며, 실제로 맡을 때는 해당 결정에 별도로 수락 댓글을 남깁니다.
      options: ['맡을 의향 있음', '협의 필요', '제안만 하고 싶음']
    validations: {required: true}
